version: '3.8'

services:
  web:
    build: .
    container_name: lp_chatbot_api
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - DEBUG=False
      - SERVER_HOST=${SERVER_HOST:-0.0.0.0}
      - LOG_LEVEL=WARNING
      - REDIS_URL=redis://redis:6379/0
      # LLM (tương thích OpenAI). Hỗ trợ cả OPENAI_* lẫn tên rút gọn API_KEY/BASE_URL.
      - OPENAI_API_KEY=${OPENAI_API_KEY:-${API_KEY:-}}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-${BASE_URL:-}}
      - MODEL_NAME=${MODEL_NAME:-gpt-4o-mini}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - lp_network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://${SERVER_HOST:-localhost}:8000/" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: lp_chatbot_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - lp_network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  lp_network:
    driver: bridge

volumes:
  redis_data:
