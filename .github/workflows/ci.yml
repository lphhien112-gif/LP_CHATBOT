name: Python CI for LP Chatbot

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Code Quality & Security Checks
  # ─────────────────────────────────────────────
  lint-and-security:
    name: Lint & Security Scan
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Install Quality Tools
      run: |
        python -m pip install --upgrade pip
        pip install ruff bandit

    - name: Ruff - Code Style Check
      run: ruff check . --select E,W,F --ignore E501

    - name: Bandit - Security Scan
      run: bandit -r app/ -ll --skip B101

  # ─────────────────────────────────────────────
  # Job 2: Unit & Integration Tests
  # ─────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint-and-security

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Install system dependencies (CBC Solver)
      run: |
        sudo apt-get update
        sudo apt-get install -y coinor-cbc

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
        playwright install chromium

    - name: Run Tests with Coverage
      run: |
        pytest tests/ -v \
          --cov=app \
          --cov-report=term-missing \
          --cov-fail-under=60
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        MODEL_NAME: ${{ secrets.MODEL_NAME || 'gpt-4.1-nano-2025-04-14' }}
        DEBUG: "False"
        REDIS_URL: ""
