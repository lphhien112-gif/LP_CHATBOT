name: Python CI for LP Chatbot

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'
        
    - name: Install system dependencies (CBC Solver)
      run: |
        sudo apt-get update
        sudo apt-get install -y coinor-cbc
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio pytest-playwright
        
        # Cài đặt Playwright browsers (cần cho E2E test)
        playwright install chromium
        
    - name: Run Pytest Tests (Unit & E2E)
      run: |
        pytest tests/ -v
      env:
        GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}  # Mock hoặc Use real key cho test
        DEBUG: False
