<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LP Chatbot — Trợ lý Quy hoạch Tuyến tính</title>
    <meta name="description" content="Chatbot AI chuyên giải quyết các bài toán Quy hoạch Tuyến tính (Linear Programming) bằng nhiều phương pháp: Simplex, 2-Pha, Dual, Geometric.">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">

    <!-- Design System -->
    <link rel="stylesheet" href="/static/css/style.css">

    <!-- KaTeX for math rendering (loaded SYNCHRONOUSLY before main.js) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

    <!-- Marked.js for Markdown → HTML (loaded SYNCHRONOUSLY) -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body>
    <div class="app">

        <!-- ════════════ HEADER ════════════ -->
        <header class="app-header" role="banner">
            <div class="header-brand">
                <div class="brand-icon" aria-hidden="true">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                         stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0
                               002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2
                               2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2
                               2 0 01-2-2z" />
                    </svg>
                </div>
                <div>
                    <div class="brand-name">LP Chatbot</div>
                    <div class="brand-sub">Trợ lý Quy hoạch Tuyến tính</div>
                </div>
            </div>
            <div id="status-badge" class="status-badge" role="status" aria-live="polite">
                <span class="status-dot dot-green" aria-hidden="true"></span>
                <span>Sẵn sàng</span>
            </div>
        </header>

        <!-- ════════════ MESSAGES ════════════ -->
        <main id="chat-messages" role="log" aria-label="Cuộc trò chuyện" aria-live="polite">
            <div id="messages-inner" role="list"></div>
        </main>

        <!-- ════════════ SUGGESTION PILLS ════════════ -->
        <nav id="suggestion-area" aria-label="Gợi ý nhanh"></nav>

        <!-- ════════════ INPUT ════════════ -->
        <footer class="app-footer" role="contentinfo">
            <form id="chat-form" autocomplete="off" aria-label="Nhập tin nhắn">
                <div class="input-wrapper">
                    <label for="message-input" class="sr-only">Nhập bài toán hoặc câu hỏi về LP</label>
                    <textarea
                        id="message-input"
                        name="message"
                        rows="1"
                        placeholder="Nhập bài toán hoặc câu hỏi về LP..."
                        aria-label="Nhập bài toán hoặc câu hỏi"
                        maxlength="5000"
                    ></textarea>
                    <button type="submit" id="send-button" aria-label="Gửi tin nhắn" disabled>
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                             stroke="currentColor" stroke-width="2.5" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14M12 5l7 7-7 7" />
                        </svg>
                    </button>
                </div>
                <div class="input-hints">
                    <p id="input-hint">
                        Nhấn <kbd>Enter</kbd> để gửi &nbsp;·&nbsp; <kbd>Shift+Enter</kbd> để xuống dòng
                    </p>
                    <span id="char-counter" aria-live="polite"></span>
                </div>
            </form>
        </footer>

    </div><!-- /.app -->

    <!-- Screen-reader only utility class -->
    <style>.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}</style>

    <!-- App (ES module — loads api.js and ui.js as imports).
         type="module" scripts are deferred automatically, so they run AFTER
         the synchronous KaTeX & marked.js scripts above are fully loaded. -->
    <script type="module" src="/static/js/main.js"></script>

</body>

</html>
