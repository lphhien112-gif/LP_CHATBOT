<!DOCTYPE html>
<html lang="vi" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LP Chatbot — Trợ lý Quy hoạch Tuyến tính</title>
    <meta name="description"
        content="Chatbot AI chuyên giải quyết các bài toán Quy hoạch Tuyến tính (Linear Programming).">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Thư viện KaTeX để hiển thị công thức Toán -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

    <!-- Thư viện Marked.js để convert Markdown -> HTML (bao gồm Table) -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        surface: {
                            900: '#111827',
                            800: '#1F2937',
                            700: '#374151',
                            600: '#4B5563',
                        },
                        accent: { DEFAULT: '#6366f1', hover: '#4f46e5', light: '#a5b4fc' }
                    },
                    animation: {
                        'fade-up': 'fadeUp 0.35s ease-out forwards',
                        'pulse-dot': 'pulseDot 1.4s ease-in-out infinite',
                    },
                    keyframes: {
                        fadeUp: { '0%': { opacity: 0, transform: 'translateY(12px)' }, '100%': { opacity: 1, transform: 'translateY(0)' } },
                        pulseDot: { '0%, 100%': { opacity: 0.3, transform: 'scale(0.8)' }, '50%': { opacity: 1, transform: 'scale(1)' } }
                    }
                }
            }
        }
    </script>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 5px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #374151;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #4B5563;
        }

        /* Dot typing animation */
        .typing-dot {
            width: 8px;
            height: 8px;
            background: #9ca3af;
            border-radius: 50%;
            animation: pulseDot 1.4s ease-in-out infinite;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        /* Message animations */
        .message-bubble {
            animation: fadeUp 0.35s ease-out forwards;
        }

        /* Bot message prose text */
        .bot-text b,
        .bot-text strong {
            font-weight: 600;
            color: #f3f4f6;
        }

        .bot-text ul {
            list-style: disc;
            padding-left: 1.25rem;
            margin-top: 0.5rem;
        }

        .bot-text ol {
            list-style: decimal;
            padding-left: 1.25rem;
            margin-top: 0.5rem;
        }

        .bot-text li {
            margin-bottom: 0.3rem;
        }

        .bot-text p {
            margin-bottom: 0.5rem;
        }

        .bot-text code {
            background: #374151;
            padding: 0.1rem 0.4rem;
            border-radius: 4px;
            font-size: 0.85em;
            color: #a5b4fc;
        }

        .bot-text pre {
            background: #374151;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            overflow-x: auto;
            margin-top: 0.5rem;
            font-size: 0.85em;
            color: #d1fae5;
        }

        /* Markdown Table Styling */
        .bot-text table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 0.75rem;
            margin-bottom: 0.75rem;
            font-size: 0.9em;
            text-align: left;
        }

        .bot-text th,
        .bot-text td {
            border: 1px solid #4B5563;
            padding: 0.5rem 0.75rem;
        }

        .bot-text th {
            background-color: #374151;
            font-weight: 600;
        }

        .bot-text tr:nth-child(even) {
            background-color: #1F2937;
        }

        .bot-text hr {
            border-color: #4B5563;
            margin: 1rem 0;
        }

        /* Input autogrow */
        #message-input {
            max-height: 160px;
            overflow-y: auto;
            resize: none;
            scrollbar-width: none;
        }

        #message-input::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>

<body class="bg-surface-900 text-gray-100 flex flex-col h-screen">

    <!-- ════════════════ HEADER ════════════════ -->
    <header
        class="flex items-center justify-between px-5 py-3 border-b border-surface-700 flex-shrink-0 bg-surface-800/80 backdrop-blur-sm sticky top-0 z-10">
        <div class="flex items-center gap-3">
            <!-- Logo / Icon -->
            <div class="w-9 h-9 rounded-xl bg-accent flex items-center justify-center shadow-lg shadow-accent/30">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
                </svg>
            </div>
            <div>
                <h1 class="text-sm font-semibold text-white leading-none">LP Chatbot</h1>
                <p class="text-xs text-gray-400 mt-0.5">Trợ lý Quy hoạch Tuyến tính</p>
            </div>
        </div>
        <!-- Status badge -->
        <div id="status-badge" class="flex items-center gap-1.5 text-xs text-emerald-400">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
            <span>Sẵn sàng</span>
        </div>
    </header>

    <!-- ════════════════ MESSAGES AREA ════════════════ -->
    <main id="chat-messages" class="flex-1 overflow-y-auto scroll-smooth">
        <div id="messages-inner" class="mx-auto max-w-2xl px-4 py-6 flex flex-col gap-5">
            <!-- messages are injected here -->
        </div>
    </main>

    <!-- ════════════════ SUGGESTION PILLS ════════════════ -->
    <div id="suggestion-area" class="max-w-2xl mx-auto w-full px-4 pb-2 flex flex-wrap gap-2"></div>

    <!-- ════════════════ INPUT BAR ════════════════ -->
    <footer class="flex-shrink-0 px-4 pb-5 pt-2 bg-surface-900">
        <form id="chat-form"
            class="mx-auto max-w-2xl flex items-end gap-2 bg-surface-800 rounded-2xl border border-surface-700 px-4 py-3 shadow-xl focus-within:border-accent/60 focus-within:ring-1 focus-within:ring-accent/30 transition-all">
            <textarea id="message-input" rows="1"
                class="flex-1 bg-transparent text-sm text-gray-100 placeholder-gray-500 focus:outline-none leading-relaxed"
                placeholder="Nhập bài toán hoặc câu hỏi về LP..." autocomplete="off"></textarea>
            <button type="submit" id="send-button"
                class="flex-shrink-0 w-9 h-9 bg-accent hover:bg-accent-hover rounded-xl flex items-center justify-center transition-all duration-200 disabled:opacity-40 hover:shadow-lg hover:shadow-accent/30 active:scale-95"
                aria-label="Gửi" disabled>
                <!-- Arrow up icon -->
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-white" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor" stroke-width="2.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14M12 5l7 7-7 7" />
                </svg>
            </button>
        </form>
        <p class="text-center text-xs text-gray-600 mt-2">Nhấn <kbd
                class="px-1 py-0.5 rounded bg-surface-700 text-gray-400 border border-surface-600 text-xs">Enter</kbd>
            để gửi &nbsp;·&nbsp; <kbd
                class="px-1 py-0.5 rounded bg-surface-700 text-gray-400 border border-surface-600 text-xs">Shift+Enter</kbd>
            để xuống dòng</p>
    </footer>

    <script>
        // ─── LaTeX-safe Markdown Parser ─────────────────────────────────────────
        // Problem: marked.js treats \[ as escaped [ and \] as escaped ]
        // → LaTeX delimiters get destroyed before KaTeX can render them.
        // Fix: extract all LaTeX blocks → placeholder → run marked → restore.
        function markedWithLatex(text) {
            const saved = [];
            const save = (str) => {
                const key = `\x02LATEX${saved.length}\x03`;
                saved.push(str);
                return key;
            };
            // Protect $$ display math (must come before single $)
            text = text.replace(/\$\$[\s\S]*?\$\$/g, save);
            // Protect \[...\] display math
            text = text.replace(/\\\[[\s\S]*?\\\]/g, save);
            // Protect \(...\) inline math
            text = text.replace(/\\\([\s\S]*?\\\)/g, save);
            // Protect $...$ inline math (simple, single-line only to avoid greedy match)
            text = text.replace(/\$[^$\n]+?\$/g, save);

            // Run standard markdown parser
            let html = marked.parse(text);

            // Restore saved LaTeX blocks
            saved.forEach((block, i) => {
                html = html.replace(`\x02LATEX${i}\x03`, block);
            });
            return html;
        }

        // ─── DOM Refs ──────────────────────────────────────────────────────────
        const messagesInner = document.getElementById('messages-inner');
        const chatMessages = document.getElementById('chat-messages');
        const chatForm = document.getElementById('chat-form');
        const messageInput = document.getElementById('message-input');
        const suggestionArea = document.getElementById('suggestion-area');
        const sendButton = document.getElementById('send-button');
        const statusBadge = document.getElementById('status-badge');

        let lastProblemContext = null;
        let isWaiting = false;

        // ─── Textarea Auto-resize ──────────────────────────────────────────────
        messageInput.addEventListener('input', () => {
            messageInput.style.height = 'auto';
            messageInput.style.height = Math.min(messageInput.scrollHeight, 160) + 'px';
            sendButton.disabled = messageInput.value.trim() === '';
        });

        // ─── Enter to submit ──────────────────────────────────────────────────
        messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                if (!sendButton.disabled && !isWaiting)
                    chatForm.dispatchEvent(new Event('submit', { cancelable: true }));
            }
        });

        // ─── Form Submit ──────────────────────────────────────────────────────
        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = messageInput.value.trim();
            if (!text || isWaiting) return;
            clearSuggestions();
            messageInput.value = '';
            messageInput.style.height = 'auto';
            sendButton.disabled = true;
            sendMessageToServer(text);
        });

        // ─── Set Loading State ──────────────────────────────────────────────────
        function setWaiting(val) {
            isWaiting = val;
            if (val) {
                statusBadge.innerHTML = `<span class="w-2 h-2 rounded-full bg-yellow-400 animate-pulse"></span><span class="text-yellow-400">Đang phản hồi...</span>`;
            } else {
                statusBadge.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span><span class="text-emerald-400">Sẵn sàng</span>`;
            }
        }

        // ─── Send Message ─────────────────────────────────────────────────────
        async function sendMessageToServer(messageText) {
            appendUserMessage(messageText);
            const typingRef = appendTypingIndicator();
            setWaiting(true);

            try {
                const formData = new FormData();
                formData.append('message', messageText);
                if (lastProblemContext) formData.append('context', JSON.stringify(lastProblemContext));

                const response = await fetch('/send_message', { method: 'POST', body: formData });
                typingRef.remove();
                if (!response.ok) throw new Error(`Server error: ${response.status}`);
                if (!response.body) throw new Error("Streaming not supported.");

                const reader = response.body.getReader();
                const decoder = new TextDecoder('utf-8');
                let botMsgEl = null;
                let textContainer = null;
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const parts = buffer.split('\n\n');
                    buffer = parts.pop();

                    for (const part of parts) {
                        if (!part.startsWith('data: ')) continue;
                        try {
                            const data = JSON.parse(part.substring(6));

                            if (data.type === 'chunk' || data.type === 'chunk_escaped') {
                                if (!botMsgEl) {
                                    const els = appendBotMessage('', true);
                                    botMsgEl = els.wrapper;
                                    textContainer = els.textEl;
                                }
                                let content = data.content;
                                // chunk_escaped: không escape <> vì content có thể chứa LaTeX \begin{} etc.
                                // (escaping would prevent LaTeX from being recognized by KaTeX later)

                                textContainer.innerHTML += content;
                                scrollToBottom();

                                // Debounced KaTeX render trong quá trình streaming
                                // (phòng trường hợp complete event không đến do LLM timeout)
                                if (textContainer._katexTimer) clearTimeout(textContainer._katexTimer);
                                textContainer._katexTimer = setTimeout(() => {
                                    if (window.renderMathInElement) {
                                        renderMathInElement(textContainer, {
                                            delimiters: [
                                                { left: '$$', right: '$$', display: true },
                                                { left: '$', right: '$', display: false },
                                                { left: '\\[', right: '\\]', display: true },
                                                { left: '\\(', right: '\\)', display: false }
                                            ],
                                            throwOnError: false
                                        });
                                    }
                                }, 400);
                            } else if (data.type === 'complete') {
                                if (!botMsgEl) {
                                    const els = appendBotMessage('', true);
                                    botMsgEl = els.wrapper;
                                    textContainer = els.textEl;
                                }

                                // _finalize_response returns fields FLAT in result (not wrapped in bot_response)
                                // web_routes.py error fallback DOES wrap in bot_response → handle both
                                const result = data.result || {};
                                const botRes = result.bot_response || result;  // flat first, nested fallback

                                // Sử dụng marked.parse kết hợp với DOMPurify (nếu có) hoặc trực tiếp
                                let finalHtml = botRes.text_response || '';
                                // Để hỗ trợ table và toán, parse markdown nếu allow_html là True
                                if (botRes.allow_html) {
                                    finalHtml = markedWithLatex(finalHtml);
                                } else {
                                    // Nếu chỉ là text thường từ GPT, thêm br
                                    finalHtml = finalHtml.replace(/\n/g, '<br>');
                                }

                                textContainer.innerHTML = finalHtml;

                                // Gọi KaTeX auto-render trên phần tử này sau khi render nội dung
                                if (window.renderMathInElement) {
                                    renderMathInElement(textContainer, {
                                        delimiters: [
                                            { left: '$$', right: '$$', display: true },
                                            { left: '$', right: '$', display: false },
                                            { left: '\\(', right: '\\)', display: false },
                                            { left: '\\[', right: '\\]', display: true }
                                        ],
                                        throwOnError: false
                                    });
                                }

                                // problem_context: in flat format it's at result.problem_context
                                const problemCtx = result.problem_context || (result.bot_response && result.bot_response.problem_context);
                                if (problemCtx) lastProblemContext = problemCtx;
                                else if (messageText.toLowerCase().includes('bài toán mới')) lastProblemContext = null;

                                const suggestions = botRes.suggestions || [];
                                if (suggestions.length) displaySuggestions(suggestions);
                                scrollToBottom(true);
                            }
                        } catch (err) {
                            console.error('SSE parse error:', err);
                        }
                    }
                }
            } catch (error) {
                typingRef?.remove?.();
                appendBotMessage('⚠️ Không thể kết nối tới server. Vui lòng thử lại.', false);
                console.error(error);
            } finally {
                setWaiting(false);
                messageInput.focus();
            }
        }

        // ─── Render Helpers ───────────────────────────────────────────────────
        function appendUserMessage(text) {
            const el = document.createElement('div');
            el.className = 'message-bubble flex justify-end';
            el.innerHTML = `
                <div class="max-w-[80%] flex flex-col items-end gap-1">
                    <div class="bg-accent text-white text-sm px-4 py-2.5 rounded-2xl rounded-br-sm shadow-md leading-relaxed">${escapeHtml(text)}</div>
                </div>`;
            messagesInner.appendChild(el);
            scrollToBottom();
        }

        function appendBotMessage(htmlContent, streaming = false) {
            const wrapper = document.createElement('div');
            wrapper.className = 'message-bubble flex gap-3 items-start';

            const avatar = document.createElement('div');
            avatar.className = 'flex-shrink-0 w-8 h-8 rounded-xl bg-accent/20 border border-accent/30 flex items-center justify-center mt-0.5';
            avatar.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-accent-light" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" /></svg>`;

            const textEl = document.createElement('div');
            textEl.className = 'bot-text flex-1 text-sm text-gray-200 leading-relaxed bg-surface-800 rounded-2xl rounded-tl-sm px-4 py-3 shadow-sm border border-surface-700';
            if (htmlContent) textEl.innerHTML = htmlContent;

            wrapper.appendChild(avatar);
            wrapper.appendChild(textEl);
            messagesInner.appendChild(wrapper);
            scrollToBottom();
            return { wrapper, textEl };
        }

        function appendTypingIndicator() {
            const wrapper = document.createElement('div');
            wrapper.className = 'message-bubble flex gap-3 items-start';
            wrapper.innerHTML = `
                <div class="flex-shrink-0 w-8 h-8 rounded-xl bg-accent/20 border border-accent/30 flex items-center justify-center mt-0.5">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-accent-light" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" /></svg>
                </div>
                <div class="bg-surface-800 border border-surface-700 rounded-2xl rounded-tl-sm px-4 py-3 flex gap-1.5 items-center h-10">
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                </div>`;
            messagesInner.appendChild(wrapper);
            scrollToBottom();
            return wrapper;
        }

        // ─── Suggestions ─────────────────────────────────────────────────────
        function displaySuggestions(suggestions) {
            clearSuggestions();
            suggestions.forEach(text => {
                const btn = document.createElement('button');
                btn.className = 'px-3 py-1.5 text-xs font-medium rounded-full border border-surface-600 bg-surface-800 text-gray-300 hover:border-accent/60 hover:text-accent-light hover:bg-accent/10 transition-all duration-200 animate-fade-up';
                btn.textContent = text.replace(/✨/g, '').trim();
                btn.addEventListener('click', () => { clearSuggestions(); sendMessageToServer(text); });
                suggestionArea.appendChild(btn);
            });
        }

        function clearSuggestions() { suggestionArea.innerHTML = ''; }

        // ─── Utils ────────────────────────────────────────────────────────────
        function escapeHtml(text) {
            return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/\n/g, '<br>');
        }

        function scrollToBottom(smooth = false) {
            chatMessages.scrollTo({ top: chatMessages.scrollHeight, behavior: smooth ? 'smooth' : 'auto' });
        }

        // ─── Welcome Message ─────────────────────────────────────────────────
        window.addEventListener('load', () => {
            appendBotMessage('Xin chào! Tôi là <strong>LP Chatbot</strong> — trợ lý AI chuyên về Quy hoạch Tuyến tính.<br><br>Tôi có thể giúp bạn:<br>• Nhận diện và giải bài toán LP từ văn bản tự nhiên<br>• Giải thích các bước giải (Simplex, CBC...)<br>• Vẽ đồ thị miền khả thi (Geometric method)<br><br>Hãy thử bắt đầu với một câu hỏi hoặc bài toán! 🚀', false);
            displaySuggestions(['Giải bài toán mẫu', 'Giải thích Simplex là gì?', 'Biến bù là gì?', 'Bài toán không khả thi là sao?']);
        });
    </script>
</body>

</html>
